<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit Pro Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #020617; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .sidebar-item.active { background: #1e293b; border-right: 4px solid #10b981; color: white; }
        @media print { .no-print { display: none !important; } main { width: 100%; } }
    </style>
</head>
<body class="bg-slate-950 text-slate-200">

    <div class="flex min-h-screen">
        <aside class="w-64 bg-slate-900 border-l border-slate-800 flex flex-col no-print">
            <div class="p-6 flex items-center gap-3 border-b border-slate-800">
                <div class="w-8 h-8 bg-emerald-500 rounded-lg flex items-center justify-center">
                    <i data-lucide="zap" class="text-white w-5 h-5"></i>
                </div>
                <span class="font-black text-xl tracking-tight">FIT <span class="text-emerald-500">PRO</span></span>
            </div>
            
            <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
                <div onclick="switchTab('dictionary', this)" class="sidebar-item active p-3 rounded-xl cursor-pointer flex items-center gap-3 transition-all">
                    <i data-lucide="book-open" class="w-5 h-5"></i><span>قاموس التمارين</span>
                </div>
                <div onclick="switchTab('gym-program', this)" class="sidebar-item p-3 rounded-xl cursor-pointer flex items-center gap-3 text-slate-400 hover:bg-slate-800 transition-all">
                    <i data-lucide="dumbbell" class="w-5 h-5"></i><span>برنامج التقويات</span>
                </div>
                <div onclick="switchTab('run-program', this)" class="sidebar-item p-3 rounded-xl cursor-pointer flex items-center gap-3 text-slate-400 hover:bg-slate-800 transition-all">
                    <i data-lucide="timer" class="w-5 h-5"></i><span>برنامج الجري</span>
                </div>
                <div onclick="switchTab('rowing-program', this)" class="sidebar-item p-3 rounded-xl cursor-pointer flex items-center gap-3 text-slate-400 hover:bg-slate-800 transition-all">
                    <i data-lucide="waves" class="w-5 h-5"></i><span>برنامج التجديف</span>
                </div>
                <div onclick="switchTab('user-profile', this)" class="sidebar-item p-3 rounded-xl cursor-pointer flex items-center gap-3 text-slate-400 hover:bg-slate-800 transition-all">
                    <i data-lucide="user" class="w-5 h-5"></i><span>ملف العميل</span>
                </div>
            </nav>

            <button onclick="window.print()" class="m-4 p-3 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold flex items-center justify-center gap-2 transition-all">
                <i data-lucide="printer" class="w-4 h-4"></i> طباعة التقرير
            </button>
        </aside>

        <main class="flex-1 p-8 lg:p-12 overflow-y-auto">
            
            <section id="dictionary" class="tab-content active">
                <h2 class="text-3xl font-black mb-6 uppercase italic">Exercise Library</h2>
                <div id="dictionary-container"></div>
            </section>

            <section id="gym-program" class="tab-content">
                <h2 class="text-3xl font-black mb-6 uppercase italic text-emerald-500">Gym Strength Program</h2>
                <div id="gym-setup-area" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-10"></div>
                <div id="full-program-tables" class="space-y-8"></div>
            </section>

            <section id="run-program" class="tab-content">
                <h2 class="text-3xl font-black mb-6 uppercase italic text-rose-500">Running Protocol</h2>
                <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 mb-8">
                    <label class="block text-sm font-bold text-slate-500 mb-3">أفضل مسافة جريتها في 30 دقيقة (كم):</label>
                    <input type="number" id="base-distance" oninput="calculateRunStats()" placeholder="مثال: 5.5" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-white font-bold">
                </div>
                <div class="grid grid-cols-2 gap-4 mb-8">
                    <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 text-center">
                        <p class="text-xs text-slate-500">السرعة الحالية</p>
                        <div id="current-pace" class="text-2xl font-black">--:--</div>
                    </div>
                    <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 text-center">
                        <p class="text-xs text-slate-500">كم / ساعة</p>
                        <div id="current-speed" class="text-2xl font-black">--</div>
                    </div>
                </div>
                <div id="run-weeks-container"></div>
            </section>

            <section id="rowing-program" class="tab-content">
                <h2 class="text-3xl font-black mb-6 uppercase italic text-orange-500">Concept 2 Program</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800">
                        <label class="block text-xs font-bold text-slate-500 mb-2 uppercase">2000m Test Time</label>
                        <div class="flex gap-2">
                            <input type="number" id="row-min" placeholder="Min" class="w-1/2 bg-slate-950 border border-slate-800 rounded-xl p-3 text-center">
                            <input type="number" id="row-sec" placeholder="Sec" class="w-1/2 bg-slate-950 border border-slate-800 rounded-xl p-3 text-center">
                        </div>
                        <button onclick="calculateRowingStats()" class="w-full mt-4 bg-orange-600 py-3 rounded-xl font-bold">Calculate Split</button>
                    </div>
                    <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 text-center flex flex-col justify-center">
                        <span class="text-xs text-slate-500 uppercase">Target 500m Split</span>
                        <div id="target-split" class="text-4xl font-black">--:--</div>
                    </div>
                </div>
                <div id="rowing-roadmap"></div>
            </section>

            <section id="user-profile" class="tab-content">
                <h2 class="text-3xl font-black mb-6 uppercase italic text-indigo-500">Client Profile</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800">
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <input type="number" id="user-age" oninput="calculateBodyComposition()" placeholder="العمر" class="bg-slate-950 border border-slate-800 rounded-xl p-3">
                            <select id="user-gender" onchange="calculateBodyComposition()" class="bg-slate-950 border border-slate-800 rounded-xl p-3">
                                <option value="male">ذكر</option>
                                <option value="female">أنثى</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-4 mb-6">
                            <input type="number" id="user-height" oninput="calculateBodyComposition()" placeholder="الطول (سم)" class="bg-slate-950 border border-slate-800 rounded-xl p-3">
                            <input type="number" id="user-weight" oninput="calculateBodyComposition()" placeholder="الوزن (كجم)" class="bg-slate-950 border border-slate-800 rounded-xl p-3">
                        </div>
                        <div class="p-4 bg-slate-950 rounded-2xl border border-slate-800 grid grid-cols-3 gap-4 text-center font-bold">
                            <div><p class="text-[10px] text-slate-500">BMI</p><p id="res-bmi" class="text-indigo-400">--</p></div>
                            <div><p class="text-[10px] text-slate-500">BMR</p><p id="res-bmr" class="text-emerald-400">--</p></div>
                            <div><p class="text-[10px] text-slate-500">Calories</p><p id="res-calories" class="text-rose-400 text-[10px]">--</p></div>
                        </div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script>
        // 1. نظام التنقل
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active', 'text-white'));
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active', 'text-white');
            lucide.createIcons();
        }

        // 2. بيانات القاموس
        const dictionaryData = {
            "Chest (الصدر)": { icon: "shield", color: "text-blue-500", sub: { "Exercises": ["Flat Bench Press", "Incline Dumbbell Press", "Chest Press Machine"] }},
            "Back (الظهر)": { icon: "align-justify", color: "text-emerald-500", sub: { "Exercises": ["Deadlift", "Bent-Over Row", "Lat Pulldown"] }},
            "Legs (الأرجل)": { icon: "footprints", color: "text-amber-500", sub: { "Exercises": ["Back Squat", "Leg Press", "Romanian Deadlift"] }},
            "Shoulders": { icon: "user", color: "text-purple-500", sub: { "Exercises": ["Overhead Press", "Lateral Raise"] }}
        };

        let selectedExercises = JSON.parse(localStorage.getItem('selectedExercises')) || [];
        let tenRMData = JSON.parse(localStorage.getItem('tenRMData')) || {};

        function renderDictionary() {
            const container = document.getElementById('dictionary-container');
            container.innerHTML = '';
            for (const [cat, data] of Object.entries(dictionaryData)) {
                let html = `<div class="mb-8"><h3 class="font-bold flex items-center gap-2 mb-4"><i data-lucide="${data.icon}" class="${data.color}"></i> ${cat}</h3><div class="grid grid-cols-2 md:grid-cols-3 gap-3">`;
                data.sub.Exercises.forEach(ex => {
                    const isSelected = selectedExercises.includes(ex);
                    html += `<div onclick="toggleExercise('${ex}')" class="p-3 rounded-xl border ${isSelected ? 'border-emerald-500 bg-emerald-500/10' : 'border-slate-800 bg-slate-900'} cursor-pointer text-sm flex justify-between"><span>${ex}</span><i data-lucide="${isSelected ? 'check-circle' : 'circle'}" class="w-4 h-4"></i></div>`;
                });
                container.innerHTML += html + `</div></div>`;
            }
            lucide.createIcons();
        }

        function toggleExercise(name) {
            const idx = selectedExercises.indexOf(name);
            idx > -1 ? selectedExercises.splice(idx, 1) : selectedExercises.push(name);
            localStorage.setItem('selectedExercises', JSON.stringify(selectedExercises));
            renderDictionary();
            renderGymProgram();
        }

        // 3. برمجة القوة
        function renderGymProgram() {
            const area = document.getElementById('gym-setup-area');
            area.innerHTML = selectedExercises.map(ex => `
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
