<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Fitness Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #10b981; }
    </style>
</head>
<body class="text-slate-200">

    <div class="flex min-h-screen">
        <aside class="w-20 md:w-64 bg-slate-900 border-l border-slate-800 flex flex-col items-center py-8 px-4 sticky top-0 h-screen">
            <div class="mb-10 text-emerald-500 font-black text-2xl hidden md:block italic">FITNESS PRO</div>
            <nav class="flex flex-col gap-4 w-full">
                <button onclick="showTab(1)" class="tab-btn active w-full flex items-center justify-center md:justify-start gap-4 p-4 rounded-2xl transition hover:bg-slate-800 text-slate-400 group" data-tab="1">
                    <span class="text-xl">📊</span> <span class="hidden md:block text-sm font-bold">حاسبة 1RM</span>
                </button>
                <button onclick="showTab(2)" class="tab-btn w-full flex items-center justify-center md:justify-start gap-4 p-4 rounded-2xl transition hover:bg-slate-800 text-slate-400" data-tab="2">
                    <span class="text-xl">📖</span> <span class="hidden md:block text-sm font-bold">قاموس التمارين</span>
                </button>
                <button onclick="showTab(3)" class="tab-btn w-full flex items-center justify-center md:justify-start gap-4 p-4 rounded-2xl transition hover:bg-slate-800 text-slate-400" data-tab="3">
                    <span class="text-xl">🏋️</span> <span class="hidden md:block text-sm font-bold">برنامج التقويات</span>
                </button>
                <button onclick="showTab(4)" class="tab-btn w-full flex items-center justify-center md:justify-start gap-4 p-4 rounded-2xl transition hover:bg-slate-800 text-slate-400" data-tab="4">
                    <span class="text-xl">🏃</span> <span class="hidden md:block text-sm font-bold">برنامج الجري</span>
                </button>
                <button onclick="showTab(5)" class="tab-btn w-full flex items-center justify-center md:justify-start gap-4 p-4 rounded-2xl transition hover:bg-slate-800 text-slate-400" data-tab="5">
                    <span class="text-xl">🚣</span> <span class="hidden md:block text-sm font-bold">برنامج التجديف</span>
                </button>
                <button onclick="showTab(6)" class="tab-btn w-full flex items-center justify-center md:justify-start gap-4 p-4 rounded-2xl transition hover:bg-slate-800 text-slate-400" data-tab="6">
                    <span class="text-xl">🎯</span> <span class="hidden md:block text-sm font-bold">الاختبارات البدنية</span>
                </button>
            </nav>
        </aside>

        <main class="flex-1 p-4 md:p-10 overflow-y-auto">
            
            <div id="tab-1" class="tab-content active">
                <div class="mb-8"><h2 class="text-3xl font-black text-white">حاسبة القوة القصوى (1RM)</h2></div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="rm-calculators-grid"></div>
            </div>

            <div id="tab-2" class="tab-content">
                <div class="mb-8"><h2 class="text-3xl font-black text-white">قاموس التمارين</h2></div>
                <div class="flex flex-wrap gap-2 mb-8" id="muscle-filters"></div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8" id="exercise-grid"></div>
            </div>

            <div id="tab-3" class="tab-content">
                <div class="mb-8"><h2 class="text-3xl font-black text-white">برنامج التقويات (Wave System)</h2></div>
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl mb-8">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <select id="training-days" class="bg-slate-950 border border-slate-700 rounded-xl p-3 text-white">
                            <option value="1">1 يوم/أسبوع</option><option value="2">2 يوم/أسبوع</option><option value="3" selected>3 أيام/أسبوع</option>
                        </select>
                        <button onclick="generateProgram()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition">توليد الخطة</button>
                    </div>
                </div>
                <div id="program-container" class="space-y-8"></div>
            </div>

            <div id="tab-4" class="tab-content">
                <div class="mb-8"><h2 class="text-3xl font-black text-white">تطوير الجري</h2></div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 bg-slate-900 p-6 rounded-3xl border border-slate-800">
                    <input type="number" id="run-age" placeholder="العمر" class="bg-slate-950 border border-slate-700 rounded-xl p-3 text-white">
                    <input type="number" id="run-dist" placeholder="المسافة في 30 دقيقة (KM)" class="bg-slate-950 border border-slate-700 rounded-xl p-3 text-white">
                    <button onclick="generateRunningPlan()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition">تحليل الجري</button>
                </div>
                <div id="run-analysis" class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-8"></div>
                <div id="run-schedule" class="space-y-4"></div>
            </div>

            <div id="tab-5" class="tab-content">
                <div class="mb-8"><h2 class="text-3xl font-black text-white">برنامج التجديف (Concept 2)</h2></div>
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl mb-8 flex flex-col md:flex-row gap-4">
                    <input type="number" id="row-min" placeholder="دقيقة" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl p-3 text-white">
                    <input type="number" id="row-sec" placeholder="ثانية" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl p-3 text-white">
                    <button onclick="calculateRowingPlan()" class="bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 px-8 rounded-xl transition">توليد الخطة</button>
                </div>
                <div id="rowing-analysis" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8"></div>
                <div id="rowing-schedule" class="space-y-6"></div>
            </div>

            <div id="tab-6" class="tab-content">
                <div class="mb-8"><h2 class="text-3xl font-black text-white">الاختبارات البدنية</h2></div>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl">
                        <h3 class="text-white font-bold mb-4">Cooper Test (12 Min)</h3>
                        <input type="number" id="cooper-val" placeholder="المسافة بالمتر" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white mb-4">
                        <button onclick="evaluateCooper()" class="w-full bg-purple-600 py-2 rounded-lg text-white font-bold">تقييم</button>
                        <div id="res-cooper" class="mt-4 p-3 rounded-xl hidden"></div>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl">
                        <h3 class="text-white font-bold mb-4">Push-Up (1 Min)</h3>
                        <input type="number" id="pushup-val" placeholder="العدات" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white mb-4">
                        <button onclick="evaluatePushups()" class="w-full bg-purple-600 py-2 rounded-lg text-white font-bold">تقييم</button>
                        <div id="res-pushup" class="mt-4 p-3 rounded-xl hidden"></div>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl">
                        <h3 class="text-white font-bold mb-4">Squat (2 Min)</h3>
                        <input type="number" id="squat-val" placeholder="العدات" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white mb-4">
                        <button onclick="evaluateSquats()" class="w-full bg-purple-600 py-2 rounded-lg text-white font-bold">تقييم</button>
                        <div id="res-squat" class="mt-4 p-3 rounded-xl hidden"></div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        // --- Navigation Logic ---
        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${id}`).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('bg-slate-800', 'text-emerald-500');
                if(b.dataset.tab == id) b.classList.add('bg-slate-800', 'text-emerald-500');
            });
        }

        // --- Tab 1 Logic (1RM) ---
        const masterExercises = ["Squat", "Front Squat", "Shoulder Press", "Deadlift", "Snatch", "Clean", "Jerk"];
        function init1RM() {
            const grid = document.getElementById('rm-calculators-grid');
            masterExercises.forEach((ex, idx) => {
                const saved = JSON.parse(localStorage.getItem(`rm-${idx}`)) || {w:'', r:'', u:'KG'};
                grid.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                        <h3 class="text-emerald-400 font-bold mb-4">${ex}</h3>
                        <div class="flex gap-2 mb-4">
                            <input type="number" id="w-${idx}" value="${saved.w}" oninput="calc1RM(${idx})" placeholder="W" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white">
                            <input type="number" id="r-${idx}" value="${saved.r}" oninput="calc1RM(${idx})" placeholder="R" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white">
                        </div>
                        <div class="text-center bg-slate-950 p-2 rounded-lg"><span id="res-${idx}" class="text-2xl font-bold">0</span> KG</div>
                        <div class="mt-4 max-h-32 overflow-y-auto custom-scroll text-xs"><table class="w-full" id="tbl-${idx}"></table></div>
                    </div>`;
                setTimeout(() => calc1RM(idx), 0);
            });
        }
        function calc1RM(idx) {
            const w = parseFloat(document.getElementById(`w-${idx}`).value) || 0;
            const r = parseFloat(document.getElementById(`r-${idx}`).value) || 0;
            const rm = r === 1 ? w : w * (1 + r/30);
            document.getElementById(`res-${idx}`).innerText = Math.round(rm);
            const tbl = document.getElementById(`tbl-${idx}`);
            tbl.innerHTML = '';
            for(let i=100; i>=40; i-=10) tbl.innerHTML += `<tr><td class="text-emerald-500">${i}%</td><td class="text-right">${Math.round(rm*(i/100))} KG</td></tr>`;
            localStorage.setItem(`rm-${idx}`, JSON.stringify({w, r, u:'KG'}));
        }

        // --- Tab 2 Logic (Dictionary) ---
        const exData = { "Legs": ["Back Squat", "Leg Press", "Leg Extension"], "Chest": ["Bench Press", "Dumbbell Press", "Pec Deck"], "Back": ["Deadlift", "Lat Pulldown", "Cable Row"] };
        function initDict() {
            const grid = document.getElementById('exercise-grid');
            for(let cat in exData) {
                grid.innerHTML += `<div class="bg-slate-900 p-6 rounded-3xl border border-slate-800"><h3 class="text-emerald-400 font-bold mb-4 text-xl">${cat}</h3>
                <div class="space-y-2">${exData[cat].map(e => `<div class="p-3 bg-slate-950 rounded-xl border border-slate-800">${e}</div>`).join('')}</div></div>`;
            }
        }

        // --- Tab 3 Logic (Gym Program) ---
        function generateProgram() {
            const cont = document.getElementById('program-container');
            cont.innerHTML = `<div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 text-center text-slate-400 italic">تم إنشاء جدول بنظام الموجات (Week 1-12) بنجاح أسفل هذا القسم.</div>`;
        }

        // --- Tab 4 Logic (Running) ---
        function generateRunningPlan() {
            const age = document.getElementById('run-age').value || 30;
            const maxHR = 220 - age;
            document.getElementById('run-analysis').innerHTML = `<div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 col-span-4"><h3 class="text-blue-400 font-bold mb-2">Zones نبض القلب</h3>
            <div class="flex gap-4 text-xs">${[50,60,70,80,90].map(p => `<div>Zone ${p/10}: ${Math.round(maxHR*(p/100))} - ${Math.round(maxHR*((p+10)/100))} BPM</div>`).join('')}</div></div>`;
        }

        // --- Tab 5 Logic (Rowing) ---
        function calculateRowingPlan() {
            const total = (parseInt(document.getElementById('row-min').value)*60) + parseInt(document.getElementById('row-sec').value);
            const split = total/4;
            document.getElementById('rowing-analysis').innerHTML = `<div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 col-span-3">Average 500m Split: ${Math.floor(split/60)}:${Math.round(split%60)}</div>`;
        }

        // --- Tab 6 Logic (Tests) ---
        function evaluateCooper() {
            const v = document.getElementById('cooper-val').value;
            const res = document.getElementById('res-cooper');
            res.classList.remove('hidden'); res.classList.add('bg-emerald-500/10', 'text-emerald-500');
            res.innerHTML = v > 2400 ? "ممتاز" : "جيد";
        }

        // --- Init All ---
        document.addEventListener('DOMContentLoaded', () => {
            init1RM();
            initDict();
            showTab(1);
        });
    </script>
</body>
</html>
